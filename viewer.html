<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documento PDF</title>
    <style>
        /* Esto hace que el PDF ocupe toda la pantalla sin márgenes blancos */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe src="tu-archivo.pdf">
        <p>Tu navegador no puede mostrar este PDF. 
           <a href="https://web.goodmanmfg.com/PilEcnDocSearch/pages/download/1778097784860-680C-F.pdf">Haz clic aquí para descargarlo.</a>
        </p>
    </iframe>

</body>
</html>
